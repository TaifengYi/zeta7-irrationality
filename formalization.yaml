sources:
  - title: >-
      Irrationality of ζ₇(3): first presented by this formalization and its companion manuscript
      "A determinant argument for the irrationality of ζ₇(3)" (Yi Taifeng, 15 September 2026,
      unrefereed, not otherwise published)
    type: original-proof
    relationship: other
    authors:
      - "Yi Taifeng"
    note: >-
      The companion manuscript was developed with the same human–AI collaboration as the Lean
      proof. It cites published geometric results for the radius-49 continuation. The Lean
      development instead proves that continuation internally.
  - title: "Irrationality of certain p-adic periods for small p"
    type: paper
    authors:
      - "Frank Calegari"
    id: "doi:10.1155/IMRN.2005.1235"
    location: "Int. Math. Res. Not. 2005, no. 20, 1235–1249; arXiv:math/0408214"
    relationship: background
    note: >-
      Proves irrationality of ζ_p(3) for p = 2, 3 with overconvergent p-adic modular forms. It
      motivates the method; the present result (p = 7) is not contained in it.
    author_endorsement: not-contacted
  - title: "Irrationality of some p-adic L-values"
    type: paper
    authors:
      - "Frits Beukers"
    id: "doi:10.1007/s10114-007-1029-2"
    location: "Acta Math. Sin. (Engl. Ser.) 24 (2008), 663–686"
    relationship: background
    author_endorsement: not-contacted
  - title: "On the irrationality of certain p-adic zeta values"
    type: paper
    authors:
      - "Li Lai"
      - "Cezar Lupu"
      - "Johannes Sprang"
    id: "doi:10.1007/s40687-025-00559-x"
    location: "Res. Math. Sci. 12 (2025), article 77; arXiv:2505.23088"
    relationship: background
    note: >-
      States that the irrationality of ζ_p(3) is open for every prime p ≥ 5, and gives the
      limit definition of ζ_p(s) that agrees with the Challenge definition.
    author_endorsement: not-contacted
  - title: "Analytic continuation of overconvergent eigenforms"
    type: paper
    authors:
      - "Kevin Buzzard"
    id: "doi:10.1090/S0894-0347-02-00405-8"
    location: "J. Amer. Math. Soc. 16 (2003), 29–55"
    relationship: background
    note: >-
      The continuation technique that the earlier, axiom-based stage of the project relied on.
      The final proof establishes the needed radius-49 continuation of the specific target
      series directly in Lean. It does not formalize the general theorem.
    author_endorsement: not-contacted
  - title: "An introduction to p-adic L-functions"
    type: paper
    authors:
      - "Joaquín Rodrigues Jacinto"
      - "Chris Williams"
    id: "arXiv:2309.15692"
    relationship: background
    note: >-
      The measure-theoretic construction of the Kubota–Leopoldt function used, through the
      adapted Lean formalization listed under related_formalizations, to construct ζ₇(3).
    author_endorsement: not-contacted

