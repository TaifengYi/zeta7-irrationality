status:
  scope: >-
    Formalized in full: ζ₇(3) ∉ ℚ and η = ζ₇(3)/2 ∉ ℚ, for the genuine Kubota–Leopoldt value.
    Challenge.lean defines ζ₇(3) as the 7-adic limit of the Euler-corrected Bernoulli
    approximants and states their convergence (approximant_tendsto), which the Solution proves.
    The Solution identifies this limit with the project's measure-theoretic construction
    Zeta7Main.zeta7Three.
    Not claimed: anything about ζ_p(3) for p ≠ 7 or about other p-adic zeta values.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - "Zeta7Main.zeta7Three_irrational"
    - "Zeta7Main.eta_irrational"
    - "Zeta7Main.internal_radius49_geometric_continuation"

