version: "v0.4"

project:
  name: "Irrationality of the 7-adic zeta value ζ₇(3)"
  description: >-
    A complete Lean 4 / Mathlib proof that the 7-adic zeta value ζ₇(3) is irrational. Here
    ζ₇(3) = L₇(3, ω⁻²) is the Kubota–Leopoldt value, equal to the 7-adic limit of the
    Euler-corrected Bernoulli numbers −(1 − 7^{w−1}) B_w / w over the weights
    w = 6·7^{n+1} − 2. The same is proved for η = ζ₇(3)/2.
    The proof is a determinant irrationality argument on the modular curve X₀(7), in four parts:
    independence of seven explicit germs attached to the weight −2 seven-adic Eisenstein series,
    with a uniform zero estimate; a seven-adic annular saving; an auxiliary-prime denominator
    estimate; and an Archimedean energy estimate with a kernel-checked numerical margin.
    It also uses an internal proof of the geometric continuation of the target series to every
    radius below 49, via a twisted U₇ matrix bound and initial overconvergence obtained from
    classical Eisenstein approximants.
    The Lean endpoints depend only on propext, Classical.choice and Quot.sound.
    The mathematical argument has not been refereed.
    The work is human-directed, with extensive AI assistance in both the mathematics and the Lean
    development; see the automation section and PROVENANCE.md.
  # Human authors only (Palomar human-authorship rule).
  authors:
    - "Yi Taifeng"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Yi Taifeng"

